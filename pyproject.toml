[project]
name = "zk-gchat-mcp"
version = "0.1.0"
description = "Zwarte Kraai Google Chat MCP-server (lezen + sturen, per-gebruiker OAuth)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
]

[project.scripts]
zk-gchat-mcp = "zk_gchat_mcp.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zk_gchat_mcp = ["client_secret.json"]
